apiVersion: apps/v1
kind: Deployment
metadata:
  name: immigrant-record-linkage-api
  labels:
    app: immigrant-record-linkage-api
    cost-center: data-science-research
    finops-tier: burstable
spec:
  replicas: 2
  selector:
    matchLabels:
      app: immigrant-record-linkage-api
  template:
    metadata:
      labels:
        app: immigrant-record-linkage-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      containers:
        - name: inference-api
          image: ghcr.io/alexbf88/historical-immigrant-record-linkage:latest
          ports:
            - containerPort: 8000
          resources:
            # Right-sized requests/limits aligned with FinOps (FOCP) & CKA best practices
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: immigrant-record-linkage-svc
spec:
  selector:
    app: immigrant-record-linkage-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: immigrant-record-linkage-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: immigrant-record-linkage-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
